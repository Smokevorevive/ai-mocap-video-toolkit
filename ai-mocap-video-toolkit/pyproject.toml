[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mocap-video-toolkit"
version = "0.6.3"
description = "AI motion capture from video: ingest footage, detect 3D pose, retarget to a rig, export BVH/FBX/GLB."
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "ai-mocap-video-toolkit contributors" }]
keywords = ["mocap", "motion-capture", "pose-estimation", "3d", "retarget", "bvh", "computer-vision"]

dependencies = [
  "numpy>=1.26,<2.1",
  "scipy>=1.11",
  "opencv-python>=4.9",
  "torch>=2.2,<2.6",           # CUDA 12.1 wheels recommended on Windows
  "onnxruntime-gpu>=1.17; sys_platform=='win32'",
  "mediapipe>=0.10.9",          # fallback 2D keypoint backend
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "loguru>=0.7",
]

[project.optional-dependencies]
export = ["bvhio>=0.3", "pygltflib>=1.16"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
mocap = "mocap.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["mocap*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"